[project]
name = "antoncopilot"
version = "0.1.0"
description = "Telegram Business Bot: Черновики ответов от имени Владельца"
authors = [
    { name = "trudogolik45", email = "210735425+trudogolik45@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "asyncpg>=0.32.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
antoncopilot = "antoncopilot:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
venvPath = "."
venv = ".venv"
