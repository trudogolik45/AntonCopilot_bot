services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: antoncopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antoncopilot}
      POSTGRES_DB: antoncopilot
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "antoncopilot"]
      interval: 2s
      retries: 15
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://antoncopilot:${POSTGRES_PASSWORD:-antoncopilot}@db:5432/antoncopilot
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
